  /admin/reports/{reportId}/status:
    patch:
      operationId: updateAdminReportStatus
      tags: [Admin & Moderation]
      summary: Transition report status
      security:
        - bearerAuth: []
      description: Enforces state machine transitions (OPEN -> REVIEWING -> RESOLVED/DISMISSED). Terminal states cannot be reopened.
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [REVIEWING, RESOLVED, DISMISSED]
                moderationNote:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Report status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Invalid transition from terminal state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          $ref: '#/components/responses/403ForbiddenAdmin'

