openapi: 3.0.3
info:
  title: Social Connect API
  version: 1.0.0
  description: |
    Production REST API specification for **Social Connect**, an Instagram-inspired full-stack social media application built with the MERN stack.
    
    ### Key Architecture & Security Features:
    - **Dual Token Authentication**: Short-lived JWT Access Tokens (`Authorization: Bearer <token>`) combined with rotated, HttpOnly Refresh Tokens (`refreshToken` cookie).
    - **Session Invalidation & Replay Detection**: Refresh tokens are family-tracked with automatic revocation of all sessions upon reuse attack detection.
    - **Bilateral Interaction Protections**: Immediate blocking enforcement across feeds, user search, direct messaging, comments, and stories.
    - **Content Moderation State Machine**: Multi-stage reporting queue and non-destructive moderation statuses (`ACTIVE`, `HIDDEN`, `REMOVED`).
    - **Deterministic Cursor-Based Pagination**: Stable chronological feed pagination utilizing compound `(createdAt, _id)` database indexes without offset drift.
    - **Immutable Audit Logging**: Compliance-grade, non-repudiable audit logs tracking authentication, administrative interventions, and security anomalies.
servers:
  - url: http://localhost:5000/api
    description: Local Development Server

tags:
  - name: Health
    description: Service health and database readiness probes
  - name: Authentication & Sessions
    description: User registration, credentials, token refresh, sessions, and account recovery
  - name: Users & Profiles
    description: User profile inspection, search, and profile updates
  - name: Follows & Social Graph
    description: Following, unfollowing, and relationship graph discovery
  - name: Blocks
    description: Bilateral user blocking and block status queries
  - name: Posts
    description: Media publishing, updating, deletion, and post details
  - name: Likes
    description: Atomic liking and unliking of posts
  - name: Saves
    description: Private post bookmarking and saved collection retrieval
  - name: Comments & Replies
    description: Top-level post comments and single-tier threaded replies
  - name: Home Feed
    description: Optimized fan-out-on-read chronological home feed
  - name: Notifications
    description: Structured social activity alerts and read state tracking
  - name: Stories
    description: Ephemeral 24-hour media stories
  - name: Conversations & Messages
    description: 1-on-1 direct messaging, conversation metadata, and message history
  - name: Reports
    description: User-submitted content and behavior violation reports
  - name: Admin & Moderation
    description: Administrative moderation queue, content visibility controls, and account suspensions
  - name: Admin Audit Logs
    description: Administrator-only immutable audit trail and security event forensics

paths:
  # ─── HEALTH ─────────────────────────────────────────────────────────────────
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Liveness health check
      description: Returns lightweight 200 OK to confirm the HTTP server is responsive.
      responses:
        '200':
          description: Server is live
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                success: true
                message: Server is healthy and running
                data:
                  status: healthy
                  uptime: 142.5
                  timestamp: '2026-09-20T12:00:00.000Z'

  /health/ready:
    get:
      operationId: getHealthReady
      tags: [Health]
      summary: Readiness probe
      description: Confirms that downstream database connections (MongoDB) are operational.
      responses:
        '200':
          description: Database connected and ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                success: true
                message: Server is ready to handle traffic
                data:
                  database: connected
        '503':
          description: Database disconnected or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ─── AUTHENTICATION & SESSIONS ──────────────────────────────────────────────
  /auth/register:
    post:
      operationId: registerUser
      tags: [Authentication & Sessions]
      summary: Register new user account
      description: Creates a new user profile with hashed password and dispatches an email verification token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '409':
          $ref: '#/components/responses/409Conflict'

  /auth/login:
    post:
      operationId: loginUser
      tags: [Authentication & Sessions]
      summary: Authenticate user credentials
      description: Verifies email/password, issues a short-lived Access Token in response body, and sets a secure HttpOnly Refresh Token cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=abc123xyz...; Path=/api/auth; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Account suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [Authentication & Sessions]
      summary: Rotate and refresh access token
      description: Presents the HttpOnly refresh token cookie (or x-refresh-token header). Issues a new access token and rotates the refresh token. Detects replay attacks and revokes the session family if reused.
      parameters:
        - in: header
          name: x-refresh-token
          required: false
          schema:
            type: string
          description: Alternative header if client cannot set cookies
      responses:
        '200':
          description: Token rotated and refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [Authentication & Sessions]
      summary: Logout current session
      security:
        - bearerAuth: []
      description: Explicitly revokes the active session and clears the refresh token cookie.
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /auth/logout-all:
    post:
      operationId: logoutAllSessions
      tags: [Authentication & Sessions]
      summary: Logout from all devices
      security:
        - bearerAuth: []
      description: Revokes all active refresh sessions across all devices for the authenticated user.
      responses:
        '200':
          description: All sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /auth/sessions:
    get:
      operationId: getSessions
      tags: [Authentication & Sessions]
      summary: List active login sessions
      security:
        - bearerAuth: []
      description: Returns list of active device sessions for the authenticated user with userAgent and IP metadata.
      responses:
        '200':
          description: Active sessions returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      tags: [Authentication & Sessions]
      summary: Revoke specific login session
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/404NotFound'

  /auth/change-password:
    patch:
      operationId: changePassword
      tags: [Authentication & Sessions]
      summary: Change password
      security:
        - bearerAuth: []
      description: Updates password for authenticated user and revokes all existing sessions except the current one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/400BadRequest'

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [Authentication & Sessions]
      summary: Request password reset email
      description: Generates a cryptographically secure token and sends a password reset link to user's registered email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '200':
          description: Reset email dispatched (or generic success to avoid enumeration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [Authentication & Sessions]
      summary: Complete password reset
      description: Verifies reset token hash, updates password, and revokes all active user sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/400BadRequest'

  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [Authentication & Sessions]
      summary: Verify email address
      description: Consumes the email verification token and marks account emailVerified=true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  example: f8d9c2e0b1a2...
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/400BadRequest'

  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [Authentication & Sessions]
      summary: Resend email verification link
      security:
        - bearerAuth: []
      description: Dispatches a new email verification token if the authenticated user's email is unverified.
      responses:
        '200':
          description: Verification email resent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /auth/me:
    get:
      operationId: getAuthMe
      tags: [Authentication & Sessions]
      summary: Get authenticated identity
      security:
        - bearerAuth: []
      description: Returns safe identity profile of currently authenticated user.
      responses:
        '200':
          description: Current user identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  # ─── USERS & PROFILES ───────────────────────────────────────────────────────
  /users/test:
    get:
      operationId: testUserRoute
      tags: [Users & Profiles]
      summary: Public connectivity check
      description: Verifies users route mounting.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /users/search:
    get:
      operationId: searchUsers
      tags: [Users & Profiles]
      summary: Search users
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 50
          description: Search term matching username or fullName
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/LimitQueryParam'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /users/me:
    get:
      operationId: getMyProfile
      tags: [Users & Profiles]
      summary: Get own user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Own profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    patch:
      operationId: updateMyProfile
      tags: [Users & Profiles]
      summary: Update own profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/400BadRequest'

  /users/me/blocked:
    get:
      operationId: getBlockedUsers
      tags: [Blocks]
      summary: List blocked users
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/LimitQueryParam'
      responses:
        '200':
          description: List of blocked users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /users/{username}:
    get:
      operationId: getUserProfile
      tags: [Users & Profiles]
      summary: Get public profile by username
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/UsernamePathParam'
      responses:
        '200':
          description: User profile found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          description: Blocked by or blocked target user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/404NotFound'

  /users/{username}/posts:
    get:
      operationId: getUserPosts
      tags: [Posts]
      summary: Get user profile posts grid
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/UsernamePathParam'
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/LimitQueryParam'
      responses:
        '200':
          description: Paginated posts by user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /users/{username}/block:
    post:
      operationId: blockUser
      tags: [Blocks]
      summary: Block a user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsernamePathParam'
      responses:
        '200':
          description: User blocked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Cannot block self
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: User already blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: unblockUser
      tags: [Blocks]
      summary: Unblock a user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsernamePathParam'
      responses:
        '200':
          description: User unblocked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /users/{username}/block-status:
    get:
      operationId: getBlockStatus
      tags: [Blocks]
      summary: Check block status with a user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsernamePathParam'
      responses:
        '200':
          description: Block relationship status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /users/{username}/follow:
    post:
      operationId: followUser
      tags: [Follows & Social Graph]
      summary: Follow a user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsernamePathParam'
      responses:
        '200':
          description: Successfully followed user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Cannot follow self or blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Already following user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: unfollowUser
      tags: [Follows & Social Graph]
      summary: Unfollow a user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsernamePathParam'
      responses:
        '200':
          description: Successfully unfollowed user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /users/{username}/follow-status:
    get:
      operationId: getFollowStatus
      tags: [Follows & Social Graph]
      summary: Check follow relationship status
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsernamePathParam'
      responses:
        '200':
          description: Follow status returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /users/{username}/followers:
    get:
      operationId: getFollowers
      tags: [Follows & Social Graph]
      summary: List followers of a user
      parameters:
        - $ref: '#/components/parameters/UsernamePathParam'
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/LimitQueryParam'
      responses:
        '200':
          description: Paginated followers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /users/{username}/following:
    get:
      operationId: getFollowing
      tags: [Follows & Social Graph]
      summary: List accounts followed by a user
      parameters:
        - $ref: '#/components/parameters/UsernamePathParam'
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/LimitQueryParam'
      responses:
        '200':
          description: Paginated following accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  # ─── POSTS ──────────────────────────────────────────────────────────────────
  /posts:
    post:
      operationId: createPost
      tags: [Posts]
      summary: Create new post with media
      security:
        - bearerAuth: []
      description: Publishes a new post with multipart/form-data media items (up to 10 images, JPEG/PNG/WebP magic byte validated).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                caption:
                  type: string
                  maxLength: 2200
                  example: 'Golden hour in Tokyo'
                location:
                  type: string
                  maxLength: 100
                  example: 'Tokyo, Japan'
                media:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Array of up to 10 authentic image files
      responses:
        '201':
          description: Post published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Validation error or invalid file signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Account suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: getPosts
      tags: [Posts]
      summary: Public posts feed
      parameters:
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/LimitQueryParam'
      responses:
        '200':
          description: List of active public posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /posts/{id}:
    get:
      operationId: getPostById
      tags: [Posts]
      summary: Get post by ID
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/PostIdPathParam'
      responses:
        '200':
          description: Post details with author profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          description: Post not found or moderated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: updatePost
      tags: [Posts]
      summary: Edit own post
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                caption:
                  type: string
                  maxLength: 2200
                location:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Post updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          description: IDOR protection - only post owner can edit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deletePost
      tags: [Posts]
      summary: Delete own post
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdPathParam'
      responses:
        '200':
          description: Post deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          description: Only post owner can delete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /posts/{id}/like:
    post:
      operationId: togglePostLike
      tags: [Likes]
      summary: Toggle like on post
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdPathParam'
      responses:
        '200':
          description: Like toggled (liked or unliked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /posts/{postId}/save:
    post:
      operationId: savePost
      tags: [Saves]
      summary: Save a post to private bookmarks
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      responses:
        '200':
          description: Post saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    delete:
      operationId: unsavePost
      tags: [Saves]
      summary: Remove post from private bookmarks
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      responses:
        '200':
          description: Post unsaved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /posts/{postId}/save-status:
    get:
      operationId: getSaveStatus
      tags: [Saves]
      summary: Check if post is bookmarked by current user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      responses:
        '200':
          description: Save status returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /users/me/saved-posts:
    get:
      operationId: getSavedPosts
      tags: [Saves]
      summary: List user's saved posts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/LimitQueryParam'
      responses:
        '200':
          description: Paginated saved posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  # ─── COMMENTS & REPLIES ─────────────────────────────────────────────────────
  /posts/{postId}/comments:
    post:
      operationId: createComment
      tags: [Comments & Replies]
      summary: Create top-level comment on post
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  example: 'Incredible shot!'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    get:
      operationId: getComments
      tags: [Comments & Replies]
      summary: List paginated top-level comments on a post
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/LimitQueryParam'
      responses:
        '200':
          description: Paginated comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /comments/{commentId}/replies:
    post:
      operationId: createReply
      tags: [Comments & Replies]
      summary: Reply to a top-level comment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CommentIdPathParam'
      requestBody:
        required: true
