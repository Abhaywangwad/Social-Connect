      description: Toggles accountStatus between ACTIVE and SUSPENDED. Suspending immediately revokes active sessions and disconnects sockets.
      parameters:
        - $ref: '#/components/parameters/UserIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
