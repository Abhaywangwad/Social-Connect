# ─── REUSABLE COMPONENTS ──────────────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Standard JWT access token passed in Authorization header
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken
      description: Secure HttpOnly refresh token cookie
    skipRateLimit:
      type: apiKey
      in: header
      name: x-skip-rate-limit
      description: Bypasses rate limiting in testing environments

  parameters:
    PageQueryParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 1-indexed page number

    LimitQueryParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
      description: Items per page

    UsernamePathParam:
      name: username
      in: path
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 30
      description: Target username (case-insensitive)

    PostIdPathParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: 24-character hexadecimal MongoDB ObjectId of the post

    PostIdParam:
      name: postId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: 24-character hexadecimal MongoDB ObjectId of the post

    CommentIdPathParam:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: 24-character hexadecimal MongoDB ObjectId of the comment

    ConversationIdParam:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: 24-character hexadecimal MongoDB ObjectId of the conversation

    SessionIdParam:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: 24-character hexadecimal MongoDB ObjectId of the session

    UserIdPathParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
      description: 24-character hexadecimal MongoDB ObjectId of the user

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object
          nullable: true

    ErrorEnvelope:
      type: object
      required: [success, message, error]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Resource not found
        error:
          type: object
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
              example: Resource not found

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          example: alex_chen
        email:
          type: string
          format: email
          example: alex@example.com
        password:
          type: string
          minLength: 8
          maxLength: 128
          example: SecretPass123!
        fullName:
          type: string
          maxLength: 60
          example: Alex Chen
        bio:
          type: string
          maxLength: 150
          example: Full-stack developer and photographer

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: alex@example.com
        password:
          type: string
          example: SecretPass123!

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          example: OldPassword123!
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          example: NewSecretPass123!

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          example: f9d8a7b6c5...
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          example: FreshSecretPass123!

    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          maxLength: 60
          example: Alex Chen
        bio:
          type: string
          maxLength: 150
          example: Exploring distributed systems
        avatar:
          type: string
          format: uri
          example: https://res.cloudinary.com/demo/image/upload/v1/avatar.jpg

    CreateReportRequest:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType:
          type: string
          enum: [USER, POST, COMMENT, STORY]
          example: POST
        targetId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 6aafa0cc49feee7e447560d1
        reason:
          type: string
          enum: [SPAM, HARASSMENT, SCAM, HATE_SPEECH, INAPPROPRIATE_CONTENT, IMPERSONATION, OTHER]
          example: SPAM
        details:
          type: string
          maxLength: 1000
          example: Repeated promotional links

    ModerateContentRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, HIDDEN, REMOVED]
          example: HIDDEN
        reason:
          type: string
          maxLength: 500
          example: Violates community guidelines on spam

  responses:
    400BadRequest:
      description: Invalid request body, malformed query, or validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Validation failed
            error:
              code: VALIDATION_ERROR
              message: Invalid input fields

    401Unauthorized:
      description: Authentication missing, invalid token, or revoked session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Authentication required
            error:
              code: UNAUTHORIZED
              message: Missing or invalid token

    403ForbiddenAdmin:
      description: Administrative permissions required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Administrative privileges required
            error:
              code: FORBIDDEN
              message: User does not have ADMIN role

    404NotFound:
      description: Target resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Resource not found
            error:
              code: NOT_FOUND
              message: The requested resource does not exist

    409Conflict:
      description: Resource conflict or unique constraint violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: A user with this email or username already exists
            error:
              code: CONFLICT
              message: Duplicate resource
